<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営者情報 | しばごよみ</title><meta name="description" content="しばごよみの運営者情報"><link rel="canonical" href="https://naoo047.github.io/shibagoyomi/about/"><link rel="stylesheet" href="../style.css"></head><body><header class="site"><a href="../">しばごよみ</a></header><main class="wrap"><h1>運営者情報</h1><p>しばごよみは、芝生の手入れの時期を地域ごとに調べられるよう、個人で運営しているサイトです。</p><p>時期は、自治体の芝生管理マニュアルに書かれた時期と気温の目安を出発点に、気象庁の平年値で各地の気温に合わせて計算しています。使った資料は各ページの「根拠」に載せています。</p></main><footer class="site"><a href="../about/">運営者情報</a> ・ <a href="../privacy/">プライバシーポリシー</a><p>気温の出典：気象庁「平年値（統計期間1991〜2020年）」を加工して作成</p></footer></body></html>
